# The production counterpart of the Vite dev proxy: /api/... is forwarded to the backend with the prefix removed.
server {
  listen 80;
  client_max_body_size 16m; # document uploads (the API enforces 15 MB)
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s; # a written answer can take a while
  }

  # Single-page app: unknown paths fall back to index.html so client-side routes work on refresh.
  location / {
    try_files $uri /index.html;
  }
}
